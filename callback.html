<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected — Fifi Uploader</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;line-height:1.6;color:#222}
h1{font-size:1.6rem}
code{display:block;background:#f1f3f4;border:1px solid #dadce0;border-radius:8px;padding:16px;word-break:break-all;font-size:.85rem;user-select:all}
.err{color:#b3261e}
</style>
</head>
<body>
<h1>Connected.</h1>
<div id="out"><p>Reading authorization code…</p></div>
<script>
(function(){
  var out = document.getElementById('out');
  var q = new URLSearchParams(window.location.search);
  var code = q.get('code');
  var err = q.get('error');
  if (err) {
    out.innerHTML = '<p class="err">Authorization failed: ' +
      err.replace(/</g,'&lt;') + '. Please go back and try again.</p>';
    return;
  }
  if (!code) {
    out.innerHTML = '<p class="err">No authorization code found in the URL. ' +
      'Please restart the sign-in from the chat.</p>';
    return;
  }
  out.innerHTML = '<p><strong>Copy the code below</strong> and paste it in the chat ' +
    'within a few minutes (it expires quickly):</p><code id="c"></code>';
  document.getElementById('c').textContent = code;
})();
</script>
</body>
</html>
